name: veriqo
description: Verified ecommerce marketplace with seller approval system
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  animate_do: ^3.3.4

  # Image Handling
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0

  # Camera / QR Scanner
  mobile_scanner: ^4.0.0

  # File Picker
  file_picker: ^8.1.2

  # Utils
  intl: ^0.19.0
  timeago: ^3.6.1
  uuid: ^4.3.3
  path: ^1.9.0
  dio: ^5.4.1

  # Storage
  shared_preferences: ^2.2.2

  # Icons
  hugeicons: ^0.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
